<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber-Tech Background</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505; /* Dark charcoal */
            overflow: hidden;
            font-family: monospace;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="cyberCanvas"></canvas>

    <script>
        const canvas = document.getElementById('cyberCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas to full window size (16:9 ratio best for YouTube if window is sized properly)
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Neon Green Color Palette
        const colors = {
            main: '#00ff41',
            dim: 'rgba(0, 255, 65, 0.2)',
            glow: 'rgba(0, 255, 65, 0.6)',
            bg: 'rgba(5, 5, 5, 0.9)'
        };

        // Binary Data Stream setup
        const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) {
            drops[x] = 1;
        }

        // Draw HUD Panels
        function drawHUD() {
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors.main;
            ctx.strokeStyle = colors.main;
            ctx.lineWidth = 1;

            const panelWidth = 250;
            const padding = 40;

            // Left Panel
            ctx.fillStyle = 'rgba(0, 50, 10, 0.3)';
            ctx.fillRect(padding, padding, panelWidth, canvas.height - padding * 2);
            ctx.strokeRect(padding, padding, panelWidth, canvas.height - padding * 2);
            
            // Left Panel Details (Mock graphs)
            ctx.beginPath();
            ctx.moveTo(padding + 20, padding + 50);
            for(let i=0; i<10; i++) {
                ctx.lineTo(padding + 20 + (i*20), padding + 100 - (Math.random() * 50));
            }
            ctx.stroke();

            // Right Panel
            const rightX = canvas.width - panelWidth - padding;
            ctx.fillRect(rightX, padding, panelWidth, canvas.height - padding * 2);
            ctx.strokeRect(rightX, padding, panelWidth, canvas.height - padding * 2);

            // Right Panel Details (Data blocks)
            for(let i=0; i<5; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? colors.glow : colors.dim;
                ctx.fillRect(rightX + 20, padding + 50 + (i * 40), panelWidth - 40, 20);
            }

            ctx.shadowBlur = 0; // Reset blur for performance
        }

        // Draw Grid
        let gridOffset = 0;
        function drawGrid() {
            ctx.strokeStyle = 'rgba(0, 255, 65, 0.1)';
            ctx.lineWidth = 1;
            const gridSize = 50;

            // Vertical lines
            for (let x = 0; x <= canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Scrolling Horizontal lines
            gridOffset = (gridOffset + 0.5) % gridSize;
            for (let y = gridOffset; y <= canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
        }

        // Animation Loop
        function animate() {
            // Semi-transparent black to create motion blur/fade effect
            ctx.fillStyle = 'rgba(5, 5, 5, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawGrid();

            // Matrix Data Rain
            ctx.fillStyle = colors.main;
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                // Keep the center uncluttered (Skip columns in the middle 50% of the screen)
                const isCenter = (i * fontSize > canvas.width * 0.25) && (i * fontSize < canvas.width * 0.75);
                
                if (!isCenter) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    
                    // Add subtle glow to text
                    ctx.shadowBlur = 5;
                    ctx.shadowColor = colors.main;
                    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                    ctx.shadowBlur = 0; // Reset

                    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
            }

            // Draw HUD on top layer so it doesn't smear
            drawHUD();

            requestAnimationFrame(animate);
        }

        // Start animation
        animate();
    </script>
</body>
</html>
